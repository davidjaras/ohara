{% extends "auth_base.html" %}
{% load i18n %}
{% block title %}{% translate "Change password" %} · ohara{% endblock %}
{% block content %}

<p class="muted links"><a href="/">{% translate "Back to the app" %}</a></p>
{% endblock %}
